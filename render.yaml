# One-click deploy of Agent Wallet Cloud (the hosted, sign-up version) on Render.
# https://render.com/deploy?repo=https://github.com/HeyanshShah/agent-wallet
# To run a private, single-person wallet instead, set HOSTED to 0 (you then sign in with OWNER_TOKEN).
services:
  - type: web
    name: agent-wallet
    runtime: docker
    plan: starter
    healthCheckPath: /health
    disk:
      name: wallet-data
      mountPath: /data
      sizeGB: 1
    envVars:
      - key: HOSTED
        value: "1"
      - key: FREE_UNTIL
        value: "2027-11-02"
      - key: SIGNUPS_OPEN
        value: "1"
      - key: OWNER_TOKEN
        generateValue: true
      - key: WALLET_ENCRYPTION_KEY
        generateValue: true
      - key: PUBLIC_URL
        sync: false
      - key: CARD_ISSUER
        value: mock
      - key: SERPAPI_KEY
        sync: false
      - key: LITHIC_API_KEY
        sync: false
      - key: LITHIC_WEBHOOK_SECRET
        sync: false
      - key: VAPID_SUBJECT
        sync: false
