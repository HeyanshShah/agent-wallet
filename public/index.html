<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0f172a">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Agent Wallet">
  <title>Agent Wallet</title>
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="icon" href="/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="/icon.svg">
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <main id="signin" class="screen" hidden>
    <div class="signin-box">
      <img src="/icon.svg" alt="" width="56" height="56">
      <h1>Agent Wallet</h1>
      <p class="muted">Paste the owner token the server printed the first time it started.</p>
      <form id="signin-form">
        <input id="token" type="password" placeholder="aw_owner_…" autocomplete="current-password" required>
        <button type="submit" class="primary">Sign in</button>
      </form>
      <p id="signin-error" class="error" hidden></p>
    </div>
  </main>

  <div id="app" hidden>
    <header>
      <h1>Agent Wallet</h1>
      <button id="push-btn" class="ghost" hidden>Notifications</button>
    </header>

    <nav>
      <button data-tab="approvals" class="active">Approvals <span id="pending-count" class="badge" hidden></span></button>
      <button data-tab="agents">Agents</button>
      <button data-tab="activity">Activity</button>
    </nav>

    <section id="tab-approvals" class="tab">
      <div id="pending-list"></div>
      <h2>Recent decisions</h2>
      <div id="recent-list"></div>
    </section>

    <section id="tab-agents" class="tab" hidden>
      <div id="agent-list"></div>
      <details id="new-agent">
        <summary class="primary-btn">Add an agent</summary>
        <form id="agent-form" class="card">
          <label>Name <input name="name" required placeholder="Travel agent"></label>
          <div class="row">
            <label>Monthly budget ($) <input name="monthly" type="number" min="0" step="0.01" required value="500"></label>
            <label>Max per purchase ($) <input name="cap" type="number" min="0" step="0.01" required value="400"></label>
          </div>
          <label>Auto-approve up to ($) <input name="auto" type="number" min="0" step="0.01" value="25"></label>
          <label>Allowed categories <input name="categories" placeholder="travel, groceries (empty = any)"></label>
          <label>Blocked stores <input name="blocked" placeholder="casino, crypto"></label>
          <button type="submit" class="primary">Create agent</button>
        </form>
      </details>
      <div id="new-key" class="card highlight" hidden></div>
    </section>

    <section id="tab-activity" class="tab" hidden>
      <ul id="event-list" class="events"></ul>
    </section>
  </div>

  <div id="toast" class="toast" hidden></div>
  <script src="/app.js" type="module"></script>
</body>
</html>
